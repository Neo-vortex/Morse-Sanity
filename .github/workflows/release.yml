name: Build & release APK

# Every push to main publishes a pre-release; pushing a tag like v1.2.0
# publishes a full release. APKs are signed with a test key generated here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate a test signing key
        # Throwaway key made fresh on each run; no real key is needed.
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/test-release.jks" \
            -storepass morse-sanity-test -keypass morse-sanity-test \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Morse Sanity CI test key, O=Not for production"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/test-release.jks
          storePassword=morse-sanity-test
          keyAlias=test
          keyPassword=morse-sanity-test
          PROPS

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the release
        id: meta
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="v${version}-build.${{ github.run_number }}"
            prerelease=true
          fi
          apk="morse-sanity-${tag}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Morse Sanity ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
          body: |
            Signed with a throwaway CI **test key**: fine for sideloading, not for store publishing.
            Each build has its own key, so uninstall the previous version before installing this one.
